name: CarDash
options:
  bundleIdPrefix: com.dapeng
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  CarDash:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dapeng.cardash
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: "2.3"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
