name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # XcodeGen 新版默认写 objectVersion 77（Xcode 16 格式），macos-14 上的 Xcode 15.4 打不开
          sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/' CarDash.xcodeproj/project.pbxproj
          grep -m1 objectVersion CarDash.xcodeproj/project.pbxproj

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project CarDash.xcodeproj \
            -target CarDash \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/CarDash.app Payload/
          zip -r CarDash.ipa Payload
          ls -la CarDash.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarDash-ipa
          path: CarDash.ipa
          if-no-files-found: error
