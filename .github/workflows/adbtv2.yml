name: Build ADBTV IPA v2

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'adbtv/**'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd adbtv
          xcodegen generate
          sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/' ADBTV.xcodeproj/project.pbxproj

      - name: Build (unsigned)
        run: |
          cd adbtv
          xcodebuild -project ADBTV.xcodeproj -target ADBTV -sdk iphoneos -configuration Release SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          cd adbtv
          mkdir -p Payload
          cp -R build/Release-iphoneos/ADBTV.app Payload/
          zip -qry ADBTV_unsigned.ipa Payload
          ls -lh ADBTV_unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ADBTV-ipa
          path: adbtv/ADBTV_unsigned.ipa
          retention-days: 30
