name: ADBTV
options:
  bundleIdPrefix: com.dapeng
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  ADBTV:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dapeng.adbtv
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: "1.7.0"
        CURRENT_PROJECT_VERSION: "10"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
